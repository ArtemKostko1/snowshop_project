version: "3"

networks:
  snowShop_network:
    driver: bridge

services:
  mariadb:
    image: mariadb:latest
    container_name: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: snowShop
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    networks:
      - snowShop_network
    # volumes:
    #   - ./data:/var/lib/mysql
