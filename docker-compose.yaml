networks:
    snowShop_network:
        driver: bridge

services:
    mariadb:
        image: temadoc1/database:latest
        container_name: mariadb
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: pass.123
            MYSQL_DATABASE: snowShop
            TZ: Europe/Minsk
        ports:
            - '3306:3306'
        volumes:
            - /var/lib/mariadb/data:/var/lib/mysql
        networks:
            - snowShop_network
